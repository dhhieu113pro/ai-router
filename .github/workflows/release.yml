name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: verify release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore AiRouter.slnx

      - name: Build
        run: dotnet build AiRouter.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test AiRouter.slnx --configuration Release --no-build

  package:
    name: package and smoke test
    needs: verify
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      major_minor: ${{ steps.version.outputs.major_minor }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Determine package version
        id: version
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Invalid package version: $version" >&2
            exit 1
          fi

          core_version="${version%%-*}"
          IFS='.' read -r major minor patch <<< "$core_version"
          major_minor="$major.$minor"

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "major_minor=$major_minor" >> "$GITHUB_OUTPUT"

      - name: Require release tag to point to main
        run: |
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

      - name: Restore
        run: dotnet restore AiRouter.slnx

      - name: Build
        run: dotnet build AiRouter.slnx --configuration Release --no-restore

      - name: Pack AIRouter.Core
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: >-
          dotnet pack src/AiRouter/AiRouter.csproj
          --configuration Release
          --no-build
          --no-restore
          --output artifacts/packages
          -p:Version="$PACKAGE_VERSION"
          -p:ContinuousIntegrationBuild=true

      - name: Pack AIRouter.AspNetCore
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: >-
          dotnet pack src/AiRouter.AspNetCore/AiRouter.AspNetCore.csproj
          --configuration Release
          --no-build
          --no-restore
          --output artifacts/packages
          -p:Version="$PACKAGE_VERSION"
          -p:ContinuousIntegrationBuild=true

      - name: Smoke test NuGet packages
        env:
          PACKAGE_VERSION: ${{ steps.version.outputs.version }}
        run: ./scripts/test-packages.sh artifacts/packages "$PACKAGE_VERSION"

      - name: Upload NuGet packages
        uses: actions/upload-artifact@v7
        with:
          name: nuget-${{ steps.version.outputs.version }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
          retention-days: 14

  publish-nuget:
    name: publish to NuGet.org
    needs: package
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Download verified packages
        uses: actions/download-artifact@v7
        with:
          name: nuget-${{ needs.package.outputs.version }}
          path: artifacts/packages

      - name: Authenticate to NuGet.org
        id: nuget-login
        uses: NuGet/login@8d196754b4036150537f80ac539e15c2f1028841 # v1
        with:
          user: dhhieu113

      - name: Publish AIRouter.Core
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
        run: >-
          dotnet nuget push
          "artifacts/packages/AIRouter.Core.${PACKAGE_VERSION}.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Publish AIRouter.AspNetCore
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          PACKAGE_VERSION: ${{ needs.package.outputs.version }}
        run: >-
          dotnet nuget push
          "artifacts/packages/AIRouter.AspNetCore.${PACKAGE_VERSION}.nupkg"
          --api-key "$NUGET_API_KEY"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
