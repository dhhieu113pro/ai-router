name: Admin Route Regression

on:
  push:
    paths:
      - Dockerfile
      - src/AiRouter.Server/**
      - src/AiRouter.Admin/**
      - .github/workflows/admin-route-regression.yml
  pull_request:
    paths:
      - Dockerfile
      - src/AiRouter.Server/**
      - src/AiRouter.Admin/**
      - .github/workflows/admin-route-regression.yml

permissions:
  contents: read

jobs:
  admin-route:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Build container
        run: docker build --tag ai-router:admin-route-test .

      - name: Verify Admin routes
        shell: bash
        run: |
          set -euo pipefail
          container_id="$(docker run --detach --publish 18080:8080 ai-router:admin-route-test)"
          cleanup() { docker rm --force "$container_id" >/dev/null 2>&1 || true; }
          trap cleanup EXIT

          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:18080/health >/dev/null; then
              break
            fi
            sleep 1
          done

          redirect_headers="$(mktemp)"
          redirect_status="$(curl --silent --output /dev/null --dump-header "$redirect_headers" --write-out '%{http_code}' http://127.0.0.1:18080/admin)"
          echo "/admin HTTP status: $redirect_status"
          cat "$redirect_headers"
          test "$redirect_status" = "302"
          tr -d '\r' < "$redirect_headers" | grep -qi '^location: /admin/$'

          admin_headers="$(mktemp)"
          admin_body="$(mktemp)"
          admin_status="$(curl --silent --output "$admin_body" --dump-header "$admin_headers" --write-out '%{http_code}' http://127.0.0.1:18080/admin/)"
          echo "/admin/ HTTP status: $admin_status"
          cat "$admin_headers"
          cat "$admin_body"
          test "$admin_status" = "200"
          grep -q '<title>AI Router Admin</title>' "$admin_body"
